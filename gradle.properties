# Gradle 构建参数
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true

# 使用 AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# 本工程放在带中文的课程目录下，AGP 默认会拒绝，这里显式关闭路径检查
android.overridePathCheck=true

# 固定 Gradle 用的 JDK，避免和系统里其他 JDK 打架
org.gradle.java.home=D:/Develop/Java/JDK17

# 本机无法访问 dl.google.com，把网络超时压短，避免 IDE 同步长时间卡在一个不可达的下载上
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=15000
systemProp.org.gradle.internal.repository.max.tentatives=2
